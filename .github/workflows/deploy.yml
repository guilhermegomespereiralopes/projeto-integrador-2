name: Build and Deploy JavaScript App

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    name: Build and Deploy JavaScript App
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase Repository Name
        id: repo_slug
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: return '${{ github.repository }}'.toLowerCase()

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ steps.repo_slug.outputs.result }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create app directory on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP_ADDRESS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p /home/${{ secrets.VPS_USERNAME }}/apps/projeto-integrador-2
            mkdir -p /home/${{ secrets.VPS_USERNAME }}/apps/projeto-integrador-2/data

      - name: Create docker-compose-prd.yml on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP_ADDRESS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/apps/projeto-integrador-2
            cat > docker-compose-prd.yml << 'EOF'
            services:
              app:
                container_name: projeto-integrador-2-app
                image: ghcr.io/${{ steps.repo_slug.outputs.result }}:latest
                env_file:
                  - .env
                ports:
                  - "${PORT}:3000"
                volumes:
                  - ./data:/data
                restart: always
            EOF

      - name: Create .env file on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP_ADDRESS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/apps/projeto-integrador-2
            cat > .env << EOF
            PORT=${{ secrets.APP_PORT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DATABASE_URL=file:/data/dev.db
            GITHUB_REPOSITORY=${{ steps.repo_slug.outputs.result }}
            EOF
            chmod 600 .env

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_IP_ADDRESS }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GH_ACTOR,GHCR_TOKEN
          script: |
            set -euo pipefail

            docker logout ghcr.io || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            cd /home/${{ secrets.VPS_USERNAME }}/apps/projeto-integrador-2
            docker pull ghcr.io/${{ steps.repo_slug.outputs.result }}:latest
            docker compose --env-file .env -f docker-compose-prd.yml config
            docker compose --env-file .env -f docker-compose-prd.yml down --remove-orphans || true

            mkdir -p /home/${{ secrets.VPS_USERNAME }}/apps/projeto-integrador-2/data

            docker compose --env-file .env -f docker-compose-prd.yml up -d --pull always --force-recreate --remove-orphans --wait
            docker compose --env-file .env -f docker-compose-prd.yml ps -a
            docker compose --env-file .env -f docker-compose-prd.yml logs --tail=200 app || true

            docker ps -a | grep projeto-integrador-2-app || { echo "Container did not start successfully"; exit 1; }
            docker image prune -f
        env:
          GH_ACTOR: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
